name: Build and deploy web game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
      - name: Import project
        run: godot --headless --path . --import || true
      - name: Gameplay smoke test
        run: |
          godot --headless --path . --script res://tests/smoke_test.gd 2>&1 | tee smoke.log
          grep -q "ALL PASSED" smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error" smoke.log
      - name: Export for Web
        run: |
          mkdir -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
